<svg viewBox="0 0 1200 300" width="1200" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marcos J Reyes, Digital Craftsman. Systems that remove friction. Built in public.">
  <rect width="1200" height="300" rx="10" fill="#0A090D"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="10" fill="none" stroke="#232030"/>

  <!-- KineticOS glyph: vault core + engine sweep; the gap is the seam, never filled.
       Motion = reduced-motion-sanctioned slow core glow + one hairline vault pulse per 6.6s cycle. -->
  <g transform="translate(78,78) scale(1.44)">
    <circle cx="50" cy="50" r="17" fill="none" stroke="#7A5CFF" stroke-width="0.8" opacity="0">
      <animate attributeName="r" values="17;64" dur="6.6s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.215 0.61 0.355 1" keyTimes="0;1"/>
      <animate attributeName="opacity" values="0.85;0" dur="6.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="50" r="17" fill="#7A5CFF">
      <animate attributeName="opacity" values="1;0.84;1" dur="4s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
    </circle>
    <path d="M 50 8 A 42 42 0 1 1 13.6 71" fill="none" stroke="#FF4C00" stroke-width="11"/>
  </g>

  <g font-family="'Hanken Grotesk','Public Sans',-apple-system,'Segoe UI',sans-serif">
    <text x="300" y="106" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
          font-size="13" font-weight="700" letter-spacing="4" fill="#FF8A57">DIGITAL CRAFTSMAN</text>
    <text x="297" y="168" font-size="56" font-weight="800" letter-spacing="-1.2" fill="#F4F1EC">Marcos J Reyes</text>
    <text x="300" y="207" font-size="20" font-weight="500" fill="#B7B1BE">Systems that remove friction. Built in public.</text>
    <text x="300" y="246" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13">
      <tspan fill="#8A8494">engine:</tspan><tspan fill="#FF8A57"> shipping</tspan>
      <tspan fill="#8A8494">   ·   vault:</tspan><tspan fill="#A695FF"> private by architecture</tspan>
    </text>
  </g>

  <!-- the seam: hard boundary, colors meet, never mix -->
  <rect x="24" y="271" width="640" height="3" rx="1.5" fill="#FF4C00"/>
  <rect x="678" y="271" width="498" height="3" rx="1.5" fill="#7A5CFF"/>
</svg>
