<svg viewBox="0 0 720 580" width="720" height="580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marcos J Reyes, Digital Craftsman. Systems that remove friction. Built in public.">
  <rect width="720" height="580" rx="18" fill="#0A090D"/>
  <rect x="0.5" y="0.5" width="719" height="579" rx="18" fill="none" stroke="#232030"/>

  <!-- KineticOS glyph, stacked layout; same sanctioned motion as the desktop banner -->
  <g transform="translate(250,48) scale(2.2)">
    <circle cx="50" cy="50" r="17" fill="none" stroke="#7A5CFF" stroke-width="0.8" opacity="0">
      <animate attributeName="r" values="17;64" dur="6.6s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.215 0.61 0.355 1" keyTimes="0;1"/>
      <animate attributeName="opacity" values="0.85;0" dur="6.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="50" r="17" fill="#7A5CFF">
      <animate attributeName="opacity" values="1;0.84;1" dur="4s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
    </circle>
    <path d="M 50 8 A 42 42 0 1 1 13.6 71" fill="none" stroke="#FF4C00" stroke-width="11"/>
  </g>

  <g font-family="'Hanken Grotesk','Public Sans',-apple-system,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="360" y="330" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"
          font-size="20" font-weight="700" letter-spacing="6" fill="#FF8A57">DIGITAL CRAFTSMAN</text>
    <text x="360" y="398" font-size="62" font-weight="800" letter-spacing="-1.4" fill="#F4F1EC">Marcos J Reyes</text>
    <text x="360" y="446" font-size="25" font-weight="500" fill="#B7B1BE">Systems that remove friction. Built in public.</text>
    <text x="360" y="494" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="19">
      <tspan fill="#8A8494">engine:</tspan><tspan fill="#FF8A57"> shipping</tspan>
      <tspan fill="#8A8494">  ·  vault:</tspan><tspan fill="#A695FF"> private</tspan>
    </text>
  </g>

  <!-- the seam: hard boundary, colors meet, never mix -->
  <rect x="28" y="542" width="380" height="4" rx="2" fill="#FF4C00"/>
  <rect x="424" y="542" width="268" height="4" rx="2" fill="#7A5CFF"/>
</svg>
